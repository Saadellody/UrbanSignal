<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>UrbanSignal — Notifications</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F8FC}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0F172A; background: #F6F8FC; min-height: 100vh">

  <header style="background: #FFFFFF; border-bottom: 1px solid #E2E8F0">
    <div style="max-width: 1200px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 32px">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #0F172A">
        <span style="width: 36px; height: 36px; border-radius: 10px; background: #2563EB; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></span>
        <span style="font-weight: 800; font-size: 19px; letter-spacing: -0.02em">UrbanSignal</span>
      </a>
      <nav aria-label="Navigation principale" style="display: flex; flex-wrap: wrap; gap: 4px; flex: 1 1 auto">
        <a href="Main.dc.html" style="padding: 10px 14px; border-radius: 10px; font-size: 15px; font-weight: 500; text-decoration: none; color: #475569">Accueil</a>
        <a href="Carte.dc.html" style="padding: 10px 14px; border-radius: 10px; font-size: 15px; font-weight: 500; text-decoration: none; color: #475569">Carte</a>
        <a href="MesSignalements.dc.html" style="padding: 10px 14px; border-radius: 10px; font-size: 15px; font-weight: 500; text-decoration: none; color: #475569">Mes signalements</a>
      </nav>
      <div style="display: flex; align-items: center; gap: 10px">
        <a href="Notifications.dc.html" aria-label="Notifications" aria-current="page" style="width: 44px; height: 44px; border-radius: 12px; background: #EFF6FF; border: 1px solid #BFDBFE; display: inline-flex; align-items: center; justify-content: center; color: #1D4ED8"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></a>
        <a href="Signaler.dc.html" style="display: inline-flex; align-items: center; gap: 8px; padding: 11px 16px; border-radius: 12px; font-size: 15px; font-weight: 700; text-decoration: none; color: #FFFFFF; background: #C2410C"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Signaler</a>
        <a href="Profil.dc.html" aria-label="Mon profil" style="width: 44px; height: 44px; border-radius: 999px; background: #DBEAFE; color: #1E40AF; font-weight: 800; font-size: 15px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center">YB</a>
      </div>
    </div>
  </header>

  <main style="max-width: 820px; margin: 0 auto; padding: 32px 24px 64px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-size: clamp(26px, 3vw, 34px); letter-spacing: -0.03em">Notifications</h1>
        <span style="font-size: 15px; color: #475569">{{unreadLabel}}</span>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button type="button" onClick="{{markAll}}" style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid #CBD5E1; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Tout marquer comme lu</button>
        <a href="Profil.dc.html#notifs" style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #334155; font-size: 14px; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center">Préférences</a>
      </div>
    </div>

    <ul style="list-style: none; margin: 0; padding: 0; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 24px; overflow: hidden">
      <sc-for list="{{items}}" as="n" hint-placeholder-count="6">
        <li style="border-top: 1px solid #F1F5F9">
          <sc-if value="{{n.header}}" hint-placeholder-val="{{ false }}">
            <div style="padding: 14px 20px 6px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #475569; background: #F8FAFC">{{n.title}}</div>
          </sc-if>
          <sc-if value="{{n.unread}}" hint-placeholder-val="{{ false }}">
            <a href="Detail.dc.html" onClick="{{n.read}}" style="display: flex; gap: 14px; padding: 18px 20px; text-decoration: none; color: #0F172A; background: #F5F9FF">
              <span style="width: 44px; height: 44px; flex: none; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; background: {{n.bg}}; color: {{n.fg}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"/></svg></span>
              <span style="flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0"><span style="font-size: 15px; font-weight: 700">{{n.title}}</span><span style="font-size: 14px; color: #475569; line-height: 1.5">{{n.text}}</span><span style="font-size: 13px; color: #475569">{{n.time}}</span></span>
              <span style="width: 10px; height: 10px; flex: none; margin-top: 6px; border-radius: 999px; background: #2563EB" aria-label="Non lue"></span>
            </a>
          </sc-if>
          <sc-if value="{{n.isRead}}" hint-placeholder-val="{{ true }}">
            <a href="Detail.dc.html" style="display: flex; gap: 14px; padding: 18px 20px; text-decoration: none; color: #0F172A">
              <span style="width: 44px; height: 44px; flex: none; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; background: {{n.bg}}; color: {{n.fg}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"/></svg></span>
              <span style="flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0"><span style="font-size: 15px; font-weight: 600">{{n.title}}</span><span style="font-size: 14px; color: #475569; line-height: 1.5">{{n.text}}</span><span style="font-size: 13px; color: #475569">{{n.time}}</span></span>
            </a>
          </sc-if>
        </li>
      </sc-for>
    </ul>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { read: {} };
  }
  renderVals() {
    var CHECK = 'M20 6 9 17l-5-5';
    var TOOL = 'M14 7l3-3 3 3-3 3M17 10 7 20l-3-3L14 7';
    var MSG = 'M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z';
    var X = 'M6 6l12 12M18 6 6 18';
    var data = [
      { header: true, title: 'Aujourd’hui' },
      { id: 1, title: 'Intervention démarrée', text: 'L’agent Karim O. a commencé les travaux sur « Nid-de-poule profond devant l’école ».', time: 'Il y a 25 min', bg: '#FFEDD5', fg: '#9A3412', icon: TOOL, unread: true },
      { id: 2, title: 'Nouveau commentaire de la mairie', text: 'Service Voirie : « La zone a été sécurisée ce matin. Réparation le 28 octobre. »', time: 'Il y a 6 h', bg: '#DBEAFE', fg: '#1E40AF', icon: MSG, unread: true },
      { header: true, title: 'Cette semaine' },
      { id: 3, title: 'Signalement résolu : à vous de noter', text: '« Dépôt sauvage à l’entrée du parc » a été marqué comme résolu. Confirmez-vous ?', time: 'Mardi 14:20', bg: '#DCFCE7', fg: '#166534', icon: CHECK, unread: true },
      { id: 4, title: 'Signalement validé', text: '« Lampadaire éteint depuis une semaine » a été validé et transmis au Service Éclairage.', time: 'Lundi 10:02', bg: '#DBEAFE', fg: '#1E40AF', icon: CHECK, unread: false },
      { id: 5, title: 'Un signalement que vous soutenez est résolu', text: '« Feu tricolore en panne, carrefour Pasteur » a été réparé.', time: 'Lundi 08:47', bg: '#DCFCE7', fg: '#166534', icon: CHECK, unread: false },
      { id: 6, title: 'Signalement non retenu', text: '« Panneau stop tombé » a été fusionné avec un signalement existant (doublon).', time: 'Dimanche 18:30', bg: '#FEE2E2', fg: '#991B1B', icon: X, unread: false }
    ];
    var read = this.state.read;
    var items = data.map((n) => {
      if (n.header) return { header: true, title: n.title, unread: false, isRead: false };
      var unread = n.unread && !read[n.id];
      return Object.assign({}, n, {
        header: false,
        unread: unread,
        isRead: !unread,
        read: () => { var r = Object.assign({}, this.state.read); r[n.id] = true; this.setState({ read: r }); }
      });
    });
    var count = items.filter((n) => n.unread).length;
    return {
      items: items,
      unreadLabel: count === 0 ? 'Vous êtes à jour' : count + ' notification' + (count > 1 ? 's' : '') + ' non lue' + (count > 1 ? 's' : ''),
      markAll: () => { var r = {}; data.forEach((n) => { if (n.id) r[n.id] = true; }); this.setState({ read: r }); }
    };
  }
}
</script>
</body>
</html>
